name: campus_connect
description: >
  Campus Connect — Coding Club Management Platform. Foundation project:
  routing, theming, DI, networking and a reusable design system. Feature
  modules (Events, Certificates, Attendance, Announcements, etc.) are built
  on top of this foundation in later iterations.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  get: ^4.6.6

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0

  # Scanning
  mobile_scanner: ^5.2.3
  # Media
  image_picker: ^1.2.3

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utilities
  dartz: ^0.10.1
  intl: ^0.19.0
  logger: ^2.4.0
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env

  # Custom fonts can be added here once brand fonts are finalized.
  # Google Fonts (used at runtime) does not require bundling.
